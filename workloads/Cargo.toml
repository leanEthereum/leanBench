[package]
name = "lean-bench-workloads"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
resolver = "2"

[[bin]]
name = "lean-bench-workloads"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rand = "0.10"
postcard = { version = "1.1", features = ["alloc"] }

# Pinned upstream SHAs. Bump deliberately.
# leanSig @ main as of 2026-05-08
leansig = { git = "https://github.com/leanEthereum/leanSig.git", rev = "c08a3bae74b0d85379cab72dcbefa4091546ecbb" }

# leanMultisig @ main as of 2026-05-08. Must include PR #206 (52abd7f2)
# or later — that's where the structured-benchmark API lives, which
# the runner uses to capture per-node proof_kib without parsing stdout.
xmss            = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "44635cabde097ac7e774297c22dcb447323e6adc" }
rec_aggregation = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "44635cabde097ac7e774297c22dcb447323e6adc" }
backend         = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "44635cabde097ac7e774297c22dcb447323e6adc" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

# Local iteration: uncomment to point at sibling checkouts of the upstream
# repos alongside leanBench (i.e. under workspace/). Keep commented in
# committed code so fresh clones pull the pinned upstream SHAs.
#
# [patch."https://github.com/leanEthereum/leanSig.git"]
# leansig = { path = "../../leanSig" }
#
# [patch."https://github.com/leanEthereum/leanMultisig.git"]
# xmss            = { path = "../../leanMultisig/crates/xmss" }
# rec_aggregation = { path = "../../leanMultisig/crates/rec_aggregation" }
# backend         = { path = "../../leanMultisig/crates/backend" }
