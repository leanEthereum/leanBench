[package]
name = "lean-bench-workloads"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
resolver = "2"

[[bin]]
name = "lean-bench-workloads"
path = "src/main.rs"

[features]
# api-leansig is the devnet4 / devnet5-era API path (LeanSigScheme via
# `leansig_wrapper`, plus a transitively-pulled `leansig`). api-xmss is
# the main-era path (free-function `xmss_*` from the local `xmss` crate;
# no leansig dep). Mutually exclusive — pick exactly one.
default = ["api-leansig"]
api-leansig = ["dep:leansig", "dep:leansig_wrapper", "dep:rec_aggregation"]
api-xmss = ["dep:xmss", "dep:rec_aggregation_main"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rand = "0.10"
postcard = { version = "1.1", features = ["alloc"] }

# api-leansig deps. Bump the devnet rev in [package.metadata.bench-pins.api-leansig]
# alongside the SHA below when moving the canonical devnet target.
leansig = { git = "https://github.com/leanEthereum/leanSig", optional = true }
leansig_wrapper = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "2498896c", optional = true }
rec_aggregation = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "2498896c", optional = true }

# api-xmss deps. The `rec_aggregation` package name collides with the
# api-leansig pin above, so we alias the main-era one as `rec_aggregation_main`
# via `package = "rec_aggregation"`; only one of the two is active per build.
xmss = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "3b246355", package = "xmss", optional = true }
rec_aggregation_main = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "3b246355", package = "rec_aggregation", optional = true }

# Branch names per feature mode — informational, baked into the binary
# by build.rs for UI display. Cargo ignores [package.metadata].
[package.metadata.bench-pins.api-leansig]
leansig-branch = "main"
leanmultisig-branch = "devnet4"

[package.metadata.bench-pins.api-xmss]
leansig-branch = "n/a"
leanmultisig-branch = "main"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

# Local iteration: uncomment to point at sibling checkouts of the upstream
# repos alongside leanBench (i.e. under workspace/). Keep commented in
# committed code so fresh clones pull the pinned upstream SHAs.
#
# [patch."https://github.com/leanEthereum/leanSig"]
# leansig = { path = "../../leanSig" }
#
# [patch."https://github.com/leanEthereum/leanMultisig.git"]
# leansig_wrapper = { path = "../../leanVM/crates/leansig_wrapper" }
# rec_aggregation = { path = "../../leanVM/crates/rec_aggregation" }
