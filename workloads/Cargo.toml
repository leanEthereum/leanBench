[package]
name = "lean-bench-workloads"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
resolver = "2"

[[bin]]
name = "lean-bench-workloads"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rand = "0.10"
postcard = { version = "1.1", features = ["alloc"] }

# Pinned upstream refs. Bump deliberately. Each dep is locked to a
# specific rev for reproducibility; the corresponding branch name
# (informational, baked into the binary by build.rs for UI display)
# lives in [package.metadata.bench-pins] below. Bump them together.
#
# leanSig: tracks whatever leanVM depends on transitively. leanVM devnet5
# declares `leansig = { git = "...", branch = "devnet4" }` — match the spec
# exactly so cargo dedups instead of pulling two leansig copies with
# incompatible trait identities.
leansig = { git = "https://github.com/leanEthereum/leanSig", branch = "devnet4" }

# leanVM devnet5 — latest head at time of this sweep.
#
# The repo was renamed from leanMultisig to leanVM upstream (2026-06).
# GitHub 301-redirects git ops for the old URL, so the legacy URL still
# resolves; it also keeps cargo's checkout dir basename as `leanmultisig-*`,
# which scripts/cloud/remote_bench.py greps for. Flip the URL and that
# matcher together on a deliberate hygiene pass.
leansig_wrapper = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "b00d6ba3" }
rec_aggregation = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "b00d6ba3" }

# Branch names corresponding to the rev pins above. Cargo itself
# ignores this section; build.rs reads it and bakes the values into
# the runner binary so result files (and the site) can show which
# upstream branch each run was tracking.
#
# `leanmultisig-branch` is kept as the key name (rather than
# `leanvm-branch`) because it flows into the result-file JSON schema —
# see workloads/src/main.rs.
[package.metadata.bench-pins]
leansig-branch = "devnet4"
leanmultisig-branch = "devnet5"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

# Local iteration: uncomment to point at sibling checkouts of the upstream
# repos alongside leanBench (i.e. under workspace/). Keep commented in
# committed code so fresh clones pull the pinned upstream SHAs.
#
# [patch."https://github.com/leanEthereum/leanSig"]
# leansig = { path = "../../leanSig" }
#
# [patch."https://github.com/leanEthereum/leanMultisig.git"]
# leansig_wrapper = { path = "../../leanVM/crates/leansig_wrapper" }
# rec_aggregation = { path = "../../leanVM/crates/rec_aggregation" }
