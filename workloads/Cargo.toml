[package]
name = "lean-bench-workloads"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
resolver = "2"

[[bin]]
name = "lean-bench-workloads"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rand = "0.10"
postcard = { version = "1.1", features = ["alloc"] }

# Pinned upstream refs. Bump deliberately. Each dep is locked to a
# specific rev for reproducibility; the corresponding branch name
# (informational, baked into the binary by build.rs for UI display)
# lives in [package.metadata.bench-pins] below. Bump them together.
#
# leanSig: tracks whatever leanMultisig depends on transitively.
# leanMultisig devnet4 declares `leansig = { git = "..." }` with no
# branch/rev — match the spec exactly so cargo dedups instead of
# pulling two leansig copies with incompatible trait identities.
leansig = { git = "https://github.com/leanEthereum/leanSig" }

# leanMultisig pointing at unnawut's fork on the rec-aggregation PR
# branch — pre-merge verification that the BenchmarkReport-returning
# API exposes per-node parity with devnet5. Bump to leanEthereum/devnet4
# (or back to devnet5) once the PR merges.
leansig_wrapper = { git = "https://github.com/unnawut/leanMultisig.git", rev = "610dd2d2" }
rec_aggregation = { git = "https://github.com/unnawut/leanMultisig.git", rev = "610dd2d2" }

# Branch names corresponding to the rev pins above. Cargo itself
# ignores this section; build.rs reads it and bakes the values into
# the runner binary so result files (and the site) can show which
# upstream branch each run was tracking.
[package.metadata.bench-pins]
leansig-branch = "main"
leanmultisig-branch = "devnet4"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

# Local iteration: uncomment to point at sibling checkouts of the upstream
# repos alongside leanBench (i.e. under workspace/). Keep commented in
# committed code so fresh clones pull the pinned upstream SHAs.
#
# [patch."https://github.com/leanEthereum/leanSig.git"]
# leansig = { path = "../../leanSig" }
#
# [patch."https://github.com/leanEthereum/leanMultisig.git"]
# xmss            = { path = "../../leanMultisig/crates/xmss" }
# rec_aggregation = { path = "../../leanMultisig/crates/rec_aggregation" }
# backend         = { path = "../../leanMultisig/crates/backend" }
